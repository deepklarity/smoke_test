<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #333;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Department</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>John Smith</td>
                <td>32</td>
                <td>Engineering</td>
            </tr>
            <tr>
                <td>Emily Johnson</td>
                <td>28</td>
                <td>Marketing</td>
            </tr>
            <tr>
                <td>Michael Brown</td>
                <td>45</td>
                <td>Finance</td>
            </tr>
            <tr>
                <td>Sarah Davis</td>
                <td>37</td>
                <td>Human Resources</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
