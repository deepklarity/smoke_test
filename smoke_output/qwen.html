<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen Smoke Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #e8f0fe 0%, #d4e4f7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(30, 80, 180, 0.15);
            padding: 2rem;
            max-width: 900px;
            width: 100%;
        }

        h1 {
            color: #1a56db;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            text-align: center;
            position: relative;
            padding-bottom: 0.75rem;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, #1a56db, #3b82f6);
            border-radius: 2px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            overflow: hidden;
            border-radius: 8px;
        }

        thead {
            background: linear-gradient(135deg, #1a56db, #3b82f6);
            color: white;
        }

        th {
            padding: 1rem 1.25rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid #e5e7eb;
            color: #374151;
        }

        tbody tr {
            transition: background-color 0.2s ease;
        }

        tbody tr:nth-child(even) {
            background-color: #f0f7ff;
        }

        tbody tr:hover {
            background-color: #e0edff;
        }

        .score-badge {
            display: inline-block;
            padding: 0.35rem 0.75rem;
            background: linear-gradient(135deg, #1a56db, #3b82f6);
            color: white;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .notes {
            color: #6b7280;
            font-style: italic;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }

            .container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            table {
                font-size: 0.85rem;
            }

            th, td {
                padding: 0.75rem 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Qwen Smoke Test</h1>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Score</th>
                    <th>Notes</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Alice Chen</td>
                    <td>Frontend Developer</td>
                    <td><span class="score-badge">92</span></td>
                    <td class="notes">Excellent UI implementation</td>
                </tr>
                <tr>
                    <td>Bob Martinez</td>
                    <td>Backend Engineer</td>
                    <td><span class="score-badge">88</span></td>
                    <td class="notes">Solid API design</td>
                </tr>
                <tr>
                    <td>Carol Zhang</td>
                    <td>DevOps Specialist</td>
                    <td><span class="score-badge">95</span></td>
                    <td class="notes">Flawless CI/CD pipeline</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
