<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen Smoke Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f9ff;
        }
        h1 {
            color: #1a56db;
            text-align: center;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            box-shadow: 0 2px 8px rgba(26, 86, 219, 0.15);
            border-radius: 8px;
            overflow: hidden;
        }
        thead {
            background-color: #1e40af;
            color: white;
        }
        th {
            padding: 16px 12px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        td {
            padding: 14px 12px;
            border-bottom: 1px solid #bfdbfe;
            color: #1e3a8a;
        }
        tbody tr:nth-child(odd) {
            background-color: #dbeafe;
        }
        tbody tr:nth-child(even) {
            background-color: #eff6ff;
        }
        tbody tr:hover {
            background-color: #bfdbfe;
        }
        .score {
            font-weight: bold;
            color: #1e40af;
        }
    </style>
</head>
<body>
    <h1>Qwen Smoke Test</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Chen</td>
                <td>Frontend Developer</td>
                <td class="score">95</td>
                <td>Excellent UI skills</td>
            </tr>
            <tr>
                <td>Bob Martinez</td>
                <td>Backend Engineer</td>
                <td class="score">88</td>
                <td>Strong API design</td>
            </tr>
            <tr>
                <td>Carol Williams</td>
                <td>DevOps Specialist</td>
                <td class="score">92</td>
                <td>Cloud expert</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
