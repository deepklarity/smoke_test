<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qwen Smoke Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #e8f0fe 0%, #d4e4fc 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      color: #1a1a2e;
    }

    .container {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(30, 80, 180, 0.12);
      max-width: 900px;
      width: 100%;
      overflow: hidden;
    }

    h1 {
      background: linear-gradient(90deg, #1a73e8 0%, #4285f4 100%);
      color: #ffffff;
      padding: 24px 32px;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .table-wrapper {
      padding: 24px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    thead th {
      background: #1a73e8;
      color: #ffffff;
      padding: 14px 16px;
      text-align: left;
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    thead th:first-child {
      border-radius: 8px 0 0 0;
    }

    thead th:last-child {
      border-radius: 0 8px 0 0;
    }

    tbody tr {
      transition: background-color 0.2s ease;
    }

    tbody tr:nth-child(odd) {
      background-color: #f0f6ff;
    }

    tbody tr:nth-child(even) {
      background-color: #ffffff;
    }

    tbody tr:hover {
      background-color: #dce6f8;
    }

    tbody td {
      padding: 12px 16px;
      font-size: 0.95rem;
      border-bottom: 1px solid #e0e8f0;
    }

    .score-badge {
      display: inline-block;
      background: linear-gradient(90deg, #1a73e8, #4285f4);
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.85rem;
    }

    @media (max-width: 640px) {
      h1 {
        font-size: 1.4rem;
        padding: 20px 24px;
      }

      .table-wrapper {
        padding: 16px;
      }

      thead th,
      tbody td {
        padding: 10px 12px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Qwen Smoke Test</h1>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Score</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Alice Chen</td>
            <td>Frontend Engineer</td>
            <td><span class="score-badge">92</span></td>
            <td>Delivered UI components ahead of schedule</td>
          </tr>
          <tr>
            <td>Bob Martinez</td>
            <td>Backend Developer</td>
            <td><span class="score-badge">88</span></td>
            <td>Optimized API response times by 40%</td>
          </tr>
          <tr>
            <td>Carol Nguyen</td>
            <td>QA Analyst</td>
            <td><span class="score-badge">95</span></td>
            <td>Identified critical security vulnerability before release</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
