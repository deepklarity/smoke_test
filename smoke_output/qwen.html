<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen Smoke Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f0f8ff;
        }

        h1 {
            color: #1e3a8a;
            text-align: center;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-collapse: collapse;
            box-shadow: 0 2px 8px rgba(30, 58, 138, 0.2);
            background-color: white;
        }

        thead {
            background-color: #1e3a8a;
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #dbeafe;
        }

        tbody tr:nth-child(odd) {
            background-color: #eff6ff;
        }

        tbody tr:nth-child(even) {
            background-color: white;
        }

        tbody tr:hover {
            background-color: #dbeafe;
            transition: background-color 0.2s ease;
        }
    </style>
</head>
<body>
    <h1>Qwen Smoke Test</h1>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Johnson</td>
                <td>Software Engineer</td>
                <td>95</td>
                <td>Excellent performance on API integration</td>
            </tr>
            <tr>
                <td>Bob Smith</td>
                <td>Data Scientist</td>
                <td>88</td>
                <td>Strong analytical skills, needs improvement on documentation</td>
            </tr>
            <tr>
                <td>Carol White</td>
                <td>Product Manager</td>
                <td>92</td>
                <td>Outstanding stakeholder communication</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
