<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen Smoke Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e3f2fd;
            margin: 0;
            padding: 40px;
        }
        h1 {
            color: #1565c0;
            text-align: center;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(21, 101, 192, 0.2);
        }
        th {
            background-color: #1976d2;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: bold;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #bbdefb;
            color: #333;
        }
        tr:hover {
            background-color: #e3f2fd;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .score {
            font-weight: bold;
            color: #1565c0;
        }
    </style>
</head>
<body>
    <h1>Qwen Smoke Test</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Chen</td>
                <td>Frontend Developer</td>
                <td class="score">95</td>
                <td>Excellent UI skills</td>
            </tr>
            <tr>
                <td>Bob Martinez</td>
                <td>Backend Engineer</td>
                <td class="score">88</td>
                <td>Strong API design</td>
            </tr>
            <tr>
                <td>Carol Williams</td>
                <td>DevOps Specialist</td>
                <td class="score">92</td>
                <td>Cloud infrastructure expert</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
