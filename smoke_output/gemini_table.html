<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Agent Table</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        h1 { color: #2e7d32; }
        table { border-collapse: collapse; width: 80%; max-width: 800px; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th { background-color: #4caf50; color: white; padding: 12px; text-align: left; }
        td { border-bottom: 1px solid #ddd; padding: 12px; }
        tr:nth-child(even) { background-color: #e8f5e9; }
        tr:hover { background-color: #c8e6c9; }
    </style>
</head>
<body>
    <h1>Gemini - CLI Agent Report</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Data Streamer</td>
                <td>Data Extraction</td>
                <td>98</td>
                <td>Excellent accuracy in parsing raw streams.</td>
            </tr>
            <tr>
                <td>Logic Weaver</td>
                <td>Architecture</td>
                <td>95</td>
                <td>Strong structural integrity in proposed solutions.</td>
            </tr>
            <tr>
                <td>Audit Bot</td>
                <td>Security</td>
                <td>100</td>
                <td>Zero vulnerabilities identified in the recent patch.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
