<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Agent Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h2 {
            color: #2e7d32;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #c8e6c9;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #4caf50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #e8f5e9;
        }
        tr:hover {
            background-color: #c8e6c9;
        }
    </style>
</head>
<body>
    <h2>Gemini Agent Table</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Agent Alpha</td>
                <td>Strategist</td>
                <td>95</td>
                <td>Excellent at identifying patterns and optimization.</td>
            </tr>
            <tr>
                <td>Agent Beta</td>
                <td>Builder</td>
                <td>88</td>
                <td>Strong implementation skills and attention to detail.</td>
            </tr>
            <tr>
                <td>Agent Gamma</td>
                <td>Validator</td>
                <td>92</td>
                <td>Thorough testing and verification specialist.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
