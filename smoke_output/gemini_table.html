<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Agent Output</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4fdf4;
        }
        h1 {
            color: #2e7d32;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #c8e6c9;
        }
        th {
            background-color: #4caf50;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        tr:nth-child(even) {
            background-color: #e8f5e9;
        }
        tr:hover {
            background-color: #c8e6c9;
        }
    </style>
</head>
<body>

    <h1>Gemini</h1>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Vance</td>
                <td>Strategist</td>
                <td>98</td>
                <td>Expert in tactical deployment and optimization.</td>
            </tr>
            <tr>
                <td>Bob Roberts</td>
                <td>Researcher</td>
                <td>92</td>
                <td>Consistently delivers high-quality data analysis.</td>
            </tr>
            <tr>
                <td>Charlie Echo</td>
                <td>Architect</td>
                <td>95</td>
                <td>Designed the core infrastructure for the project.</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
