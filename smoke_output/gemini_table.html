<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Agent Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h2 {
            color: #2e7d32;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #e8f5e9;
        }
        tr:hover {
            background-color: #c8e6c9;
        }
    </style>
</head>
<body>
    <h2>Gemini Agent's Table</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice</td>
                <td>Developer</td>
                <td>95</td>
                <td>Excellent performance and code quality.</td>
            </tr>
            <tr>
                <td>Bob</td>
                <td>Designer</td>
                <td>88</td>
                <td>Creative designs and user-focused.</td>
            </tr>
            <tr>
                <td>Charlie</td>
                <td>Manager</td>
                <td>92</td>
                <td>Strong leadership and project delivery.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
