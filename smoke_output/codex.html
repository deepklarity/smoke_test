<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Codex Smoke Test</title>
</head>
<body style="margin:0; font-family: Arial, Helvetica, sans-serif; background:#fff5f5; color:#4a0c0c;">
  <div style="max-width: 900px; margin: 40px auto; padding: 24px; background:#ffffff; border:2px solid #f2b8b8; border-radius:12px; box-shadow:0 6px 18px rgba(178, 34, 34, 0.12);">
    <h1 style="margin:0 0 18px 0; color:#b22222; letter-spacing:0.2px;">Codex Smoke Test</h1>

    <table style="width:100%; border-collapse:collapse; border:2px solid #d9534f; background:#fff;">
      <thead>
        <tr style="background:#b22222; color:#fff;">
          <th style="padding:12px; border:1px solid #d9534f; text-align:left;">Name</th>
          <th style="padding:12px; border:1px solid #d9534f; text-align:left;">Role</th>
          <th style="padding:12px; border:1px solid #d9534f; text-align:left;">Score</th>
          <th style="padding:12px; border:1px solid #d9534f; text-align:left;">Notes</th>
        </tr>
      </thead>
      <tbody>
        <tr style="background:#fffafa;">
          <td style="padding:10px 12px; border:1px solid #ef9a9a;">Ivy Calder</td>
          <td style="padding:10px 12px; border:1px solid #ef9a9a;">Data Analyst</td>
          <td style="padding:10px 12px; border:1px solid #ef9a9a;">92</td>
          <td style="padding:10px 12px; border:1px solid #ef9a9a;">Consistent and detail-oriented.</td>
        </tr>
        <tr style="background:#ffecec;">
          <td style="padding:10px 12px; border:1px solid #ef9a9a;">Ronan Vale</td>
          <td style="padding:10px 12px; border:1px solid #ef9a9a;">Product Lead</td>
          <td style="padding:10px 12px; border:1px solid #ef9a9a;">88</td>
          <td style="padding:10px 12px; border:1px solid #ef9a9a;">Strong collaboration across teams.</td>
        </tr>
        <tr style="background:#fffafa;">
          <td style="padding:10px 12px; border:1px solid #ef9a9a;">Selene Park</td>
          <td style="padding:10px 12px; border:1px solid #ef9a9a;">QA Engineer</td>
          <td style="padding:10px 12px; border:1px solid #ef9a9a;">95</td>
          <td style="padding:10px 12px; border:1px solid #ef9a9a;">Excellent bug detection accuracy.</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
