<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Smoke Test</title>
  <style>
    :root {
      --red-900: #7f1d1d;
      --red-800: #991b1b;
      --red-700: #b91c1c;
      --red-100: #fee2e2;
      --red-50: #fef2f2;
      --text: #2a0d0d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, var(--red-50), #ffffff);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .panel {
      width: min(860px, 100%);
      background: #ffffff;
      border: 3px solid var(--red-700);
      border-radius: 14px;
      box-shadow: 0 10px 26px rgba(127, 29, 29, 0.2);
      overflow: hidden;
    }

    h1 {
      margin: 0;
      padding: 20px 24px;
      background: linear-gradient(90deg, var(--red-900), var(--red-700));
      color: #fff;
      font-size: 2rem;
      letter-spacing: 0.4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      background: var(--red-100);
      color: var(--red-900);
      text-align: left;
      padding: 12px 14px;
      border: 2px solid var(--red-700);
      font-size: 0.95rem;
    }

    tbody td {
      padding: 12px 14px;
      border: 2px solid var(--red-700);
      background: #fff;
    }

    tbody tr:nth-child(even) td {
      background: #fff7f7;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Codex Smoke Test</h1>
    <table aria-label="Fictional team scores">
      <thead>
        <tr>
          <th>Name</th>
          <th>Role</th>
          <th>Score</th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Aria Vale</td>
          <td>Navigator</td>
          <td>92</td>
          <td>Mapped three anomaly zones.</td>
        </tr>
        <tr>
          <td>Dorian Pike</td>
          <td>Systems Analyst</td>
          <td>88</td>
          <td>Stabilized core logic under load.</td>
        </tr>
        <tr>
          <td>Lyra Quill</td>
          <td>Field Architect</td>
          <td>95</td>
          <td>Designed rapid shelter prototype.</td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
