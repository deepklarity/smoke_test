<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Smoke Test</title>
  <style>
    :root {
      --red-900: #4a0d0d;
      --red-700: #8b1a1a;
      --red-600: #b71c1c;
      --red-100: #fdecec;
      --red-050: #fff5f5;
      --text: #2a0a0a;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, var(--red-050), #ffffff);
      color: var(--text);
    }

    main {
      max-width: 900px;
      margin: 48px auto;
      padding: 0 20px;
    }

    h1 {
      color: var(--red-700);
      margin: 0 0 18px;
      letter-spacing: 0.2px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border: 2px solid var(--red-700);
      background: #fff;
      box-shadow: 0 10px 24px rgba(183, 28, 28, 0.12);
    }

    thead th {
      background: var(--red-600);
      color: #fff;
      text-align: left;
      font-weight: 700;
      padding: 12px;
      border: 1px solid var(--red-700);
    }

    tbody td {
      padding: 11px 12px;
      border: 1px solid #e8b3b3;
    }

    tbody tr:nth-child(odd) {
      background: var(--red-100);
    }

    tbody tr:hover {
      background: #ffdede;
    }
  </style>
</head>
<body>
  <main>
    <h1>Codex Smoke Test</h1>
    <table aria-label="Codex Smoke Test Data Table">
      <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Role</th>
          <th scope="col">Score</th>
          <th scope="col">Notes</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Avery Quinn</td>
          <td>Systems Analyst</td>
          <td>92</td>
          <td>Strong debugging under pressure.</td>
        </tr>
        <tr>
          <td>Milo Reyes</td>
          <td>QA Engineer</td>
          <td>88</td>
          <td>Excellent edge-case coverage.</td>
        </tr>
        <tr>
          <td>Nora Patel</td>
          <td>Frontend Developer</td>
          <td>95</td>
          <td>Consistent UI polish and accessibility.</td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
