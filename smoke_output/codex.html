<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Smoke Test</title>
  <style>
    :root {
      --red-900: #5a0a0a;
      --red-800: #7a1010;
      --red-700: #9e1b1b;
      --red-600: #c62828;
      --red-100: #fdecec;
      --white: #ffffff;
      --shadow: rgba(90, 10, 10, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(160deg, var(--red-100), #fff5f5);
      color: var(--red-900);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: min(900px, 100%);
      background: var(--white);
      border: 2px solid var(--red-700);
      border-radius: 12px;
      box-shadow: 0 10px 24px var(--shadow);
      padding: 24px;
    }

    h1 {
      margin: 0 0 18px;
      color: var(--red-800);
      font-size: 2rem;
      text-align: center;
      letter-spacing: 0.03em;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 8px;
    }

    thead {
      background: var(--red-700);
      color: var(--white);
    }

    th,
    td {
      padding: 12px 14px;
      text-align: left;
      border: 1px solid #f3c3c3;
    }

    tbody tr:nth-child(odd) {
      background: #fff8f8;
    }

    tbody tr:hover {
      background: #ffe5e5;
    }

    .score {
      font-weight: 700;
      color: var(--red-600);
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Codex Smoke Test</h1>
    <table aria-label="Codex smoke test results">
      <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Role</th>
          <th scope="col">Score</th>
          <th scope="col">Notes</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Ari Quill</td>
          <td>Systems Analyst</td>
          <td class="score">92</td>
          <td>Validated integration paths smoothly.</td>
        </tr>
        <tr>
          <td>Nia Crest</td>
          <td>QA Engineer</td>
          <td class="score">88</td>
          <td>Captured edge cases during smoke checks.</td>
        </tr>
        <tr>
          <td>Leo Voss</td>
          <td>DevOps Specialist</td>
          <td class="score">95</td>
          <td>Deployment pipeline remained stable.</td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
