<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Smoke Test</title>
</head>
<body style="margin: 0; font-family: Arial, Helvetica, sans-serif; background: linear-gradient(145deg, #2b0000 0%, #5a0000 100%); color: #ffe5e5; min-height: 100vh;">
  <div style="max-width: 900px; margin: 48px auto; padding: 24px;">
    <h1 style="margin: 0 0 20px 0; font-size: 42px; letter-spacing: 0.5px; color: #ffd6d6; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);">Codex Smoke Test</h1>
    <table style="width: 100%; border-collapse: collapse; border: 2px solid #ff8a8a; background: rgba(90, 0, 0, 0.62); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);">
      <thead>
        <tr style="background: #9e1111;">
          <th style="padding: 14px 12px; text-align: left; border: 1px solid #ff8a8a; color: #fff0f0;">Name</th>
          <th style="padding: 14px 12px; text-align: left; border: 1px solid #ff8a8a; color: #fff0f0;">Role</th>
          <th style="padding: 14px 12px; text-align: left; border: 1px solid #ff8a8a; color: #fff0f0;">Score</th>
          <th style="padding: 14px 12px; text-align: left; border: 1px solid #ff8a8a; color: #fff0f0;">Notes</th>
        </tr>
      </thead>
      <tbody>
        <tr style="background: rgba(130, 10, 10, 0.45);">
          <td style="padding: 12px; border: 1px solid #ff8a8a;">Nova Kestrel</td>
          <td style="padding: 12px; border: 1px solid #ff8a8a;">Systems Analyst</td>
          <td style="padding: 12px; border: 1px solid #ff8a8a;">92</td>
          <td style="padding: 12px; border: 1px solid #ff8a8a;">Handles edge-case triage quickly.</td>
        </tr>
        <tr style="background: rgba(110, 8, 8, 0.45);">
          <td style="padding: 12px; border: 1px solid #ff8a8a;">Iris Vale</td>
          <td style="padding: 12px; border: 1px solid #ff8a8a;">QA Strategist</td>
          <td style="padding: 12px; border: 1px solid #ff8a8a;">88</td>
          <td style="padding: 12px; border: 1px solid #ff8a8a;">Builds resilient smoke scenarios.</td>
        </tr>
        <tr style="background: rgba(90, 6, 6, 0.45);">
          <td style="padding: 12px; border: 1px solid #ff8a8a;">Rex Calder</td>
          <td style="padding: 12px; border: 1px solid #ff8a8a;">Release Captain</td>
          <td style="padding: 12px; border: 1px solid #ff8a8a;">95</td>
          <td style="padding: 12px; border: 1px solid #ff8a8a;">Keeps rollout logs audit-ready.</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
