<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Smoke Test</title>
  <style>
    body {
      margin: 0;
      padding: 32px;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff5f5;
      color: #5a0000;
    }

    h1 {
      margin: 0 0 20px;
      color: #b30000;
      text-align: center;
    }

    table {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      border-collapse: collapse;
      border: 2px solid #c40000;
      background: #ffffff;
      box-shadow: 0 4px 12px rgba(196, 0, 0, 0.12);
    }

    th,
    td {
      border: 1px solid #d10000;
      padding: 12px 14px;
      text-align: left;
    }

    th {
      background: #d10000;
      color: #ffffff;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    tbody tr:nth-child(even) {
      background: #ffe8e8;
    }

    tbody tr:hover {
      background: #ffd6d6;
    }
  </style>
</head>
<body>
  <h1>Codex Smoke Test</h1>
  <table aria-label="Codex smoke test data table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Role</th>
        <th>Score</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Avery Quinn</td>
        <td>Systems Analyst</td>
        <td>91</td>
        <td>Consistent high-quality reviews.</td>
      </tr>
      <tr>
        <td>Mila Hart</td>
        <td>QA Engineer</td>
        <td>88</td>
        <td>Excellent bug triage turnaround.</td>
      </tr>
      <tr>
        <td>Rohan Vale</td>
        <td>Product Designer</td>
        <td>94</td>
        <td>Strong UX proposals and prototypes.</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
