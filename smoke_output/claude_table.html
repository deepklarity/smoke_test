<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f0ff;
        }

        h1 {
            color: #6a0dad;
            text-align: center;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-collapse: collapse;
            box-shadow: 0 2px 8px rgba(106, 13, 173, 0.1);
        }

        thead {
            background-color: #6a0dad;
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: bold;
            border: 1px solid #6a0dad;
        }

        td {
            padding: 12px 15px;
            border: 1px solid #d0b3ff;
        }

        tbody tr:nth-child(odd) {
            background-color: #e6d9ff;
        }

        tbody tr:nth-child(even) {
            background-color: #f0e6ff;
        }

        tbody tr:hover {
            background-color: #d8c3ff;
        }
    </style>
</head>
<body>
    <h1>Claude</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Thompson</td>
                <td>Software Engineer</td>
                <td>92</td>
                <td>Excellent problem solver, strong in algorithms</td>
            </tr>
            <tr>
                <td>Bob Martinez</td>
                <td>Product Designer</td>
                <td>88</td>
                <td>Creative thinker, great attention to detail</td>
            </tr>
            <tr>
                <td>Carol Zhang</td>
                <td>Data Scientist</td>
                <td>95</td>
                <td>Expert in machine learning and statistical analysis</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
