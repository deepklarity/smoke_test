<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f0ff;
            padding: 20px;
        }
        h1 {
            color: #7c3aed;
            text-align: center;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 4px 6px rgba(124, 58, 237, 0.1);
        }
        th {
            background-color: #7c3aed;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: bold;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd6fe;
        }
        tr:hover {
            background-color: #f5f0ff;
        }
        tr:last-child td {
            border-bottom: 2px solid #7c3aed;
        }
    </style>
</head>
<body>
    <h1>Claude</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Johnson</td>
                <td>Software Engineer</td>
                <td>95</td>
                <td>Excellent performance on recent projects</td>
            </tr>
            <tr>
                <td>Bob Smith</td>
                <td>Product Manager</td>
                <td>88</td>
                <td>Strong leadership and communication skills</td>
            </tr>
            <tr>
                <td>Carol Davis</td>
                <td>UX Designer</td>
                <td>92</td>
                <td>Creative solutions and user-focused design</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
