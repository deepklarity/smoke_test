<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Generated Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f0ff;
        }
        h2 {
            color: #6b21a8;
            text-align: center;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-collapse: collapse;
            box-shadow: 0 2px 8px rgba(107, 33, 168, 0.2);
        }
        thead {
            background-color: #7c3aed;
        }
        th {
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: bold;
        }
        tbody tr {
            background-color: #e9d5ff;
        }
        tbody tr:nth-child(even) {
            background-color: #ddd6fe;
        }
        tbody tr:hover {
            background-color: #c4b5fd;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #c084fc;
            color: #4c1d95;
        }
    </style>
</head>
<body>
    <h2>Table Generated by Agent: Claude</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Johnson</td>
                <td>Senior Developer</td>
                <td>95</td>
                <td>Excellent code quality and mentorship</td>
            </tr>
            <tr>
                <td>Bob Martinez</td>
                <td>Product Manager</td>
                <td>88</td>
                <td>Strong stakeholder communication</td>
            </tr>
            <tr>
                <td>Carol Chen</td>
                <td>UX Designer</td>
                <td>92</td>
                <td>Innovative user interface designs</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
