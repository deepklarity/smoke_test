<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f0ff;
            padding: 20px;
        }

        h2 {
            color: #6a1b9a;
            text-align: center;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 8px rgba(106, 27, 154, 0.2);
        }

        th {
            background-color: #8e24aa;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: bold;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid #e1bee7;
        }

        tr:hover {
            background-color: #f3e5f5;
        }

        tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <h2>Claude</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Johnson</td>
                <td>Senior Developer</td>
                <td>95</td>
                <td>Excellent problem-solving skills</td>
            </tr>
            <tr>
                <td>Bob Martinez</td>
                <td>Product Manager</td>
                <td>88</td>
                <td>Strong leadership and communication</td>
            </tr>
            <tr>
                <td>Carol Chen</td>
                <td>UX Designer</td>
                <td>92</td>
                <td>Creative and detail-oriented</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
