<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Table</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f7fc;
        }

        h1 {
            color: #6b46c1;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(107, 70, 193, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            box-shadow: 0 4px 6px rgba(107, 70, 193, 0.2);
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background-color: #7c3aed;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9em;
            letter-spacing: 1px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e9d5ff;
        }

        tr:nth-child(odd) {
            background-color: #faf5ff;
        }

        tr:nth-child(even) {
            background-color: #f3e8ff;
        }

        tr:hover {
            background-color: #e9d5ff;
            transition: background-color 0.3s ease;
        }

        tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <h1>Claude</h1>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Martinez</td>
                <td>Senior Engineer</td>
                <td>95</td>
                <td>Excellent performance on backend optimization</td>
            </tr>
            <tr>
                <td>Bob Chen</td>
                <td>Product Designer</td>
                <td>88</td>
                <td>Creative UI solutions, strong user empathy</td>
            </tr>
            <tr>
                <td>Carol Thompson</td>
                <td>Data Analyst</td>
                <td>92</td>
                <td>Insightful metrics analysis and reporting</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
