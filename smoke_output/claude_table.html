<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Agent Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h2 {
            color: #663399;
            text-align: center;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-collapse: collapse;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            background-color: white;
        }
        thead {
            background-color: #663399;
            color: white;
        }
        th {
            padding: 12px;
            text-align: left;
            font-weight: bold;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #e6d9f0;
        }
        tbody tr:nth-child(odd) {
            background-color: #f3e8ff;
        }
        tbody tr:nth-child(even) {
            background-color: #e6d9f0;
        }
        tbody tr:hover {
            background-color: #d9c4f0;
        }
    </style>
</head>
<body>
    <h2>Claude Agent Table</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Johnson</td>
                <td>Senior Developer</td>
                <td>95</td>
                <td>Excellent problem solver</td>
            </tr>
            <tr>
                <td>Bob Smith</td>
                <td>UI Designer</td>
                <td>88</td>
                <td>Creative and detail-oriented</td>
            </tr>
            <tr>
                <td>Carol Lee</td>
                <td>Product Manager</td>
                <td>92</td>
                <td>Strong leadership skills</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
