<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Generated Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f0ff;
        }

        h2 {
            color: #6b21a8;
            text-align: center;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-collapse: collapse;
            box-shadow: 0 2px 8px rgba(107, 33, 168, 0.2);
            background-color: white;
        }

        thead {
            background-color: #7c3aed;
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            border: 1px solid #6b21a8;
        }

        td {
            padding: 12px 15px;
            border: 1px solid #ddd6fe;
        }

        tbody tr:nth-child(odd) {
            background-color: #f3e8ff;
        }

        tbody tr:nth-child(even) {
            background-color: #faf5ff;
        }

        tbody tr:hover {
            background-color: #e9d5ff;
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body>
    <h2>Data Table Generated by Claude</h2>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Chen</td>
                <td>Software Engineer</td>
                <td>95</td>
                <td>Excellent problem-solving skills</td>
            </tr>
            <tr>
                <td>Bob Martinez</td>
                <td>Product Manager</td>
                <td>88</td>
                <td>Strong leadership and communication</td>
            </tr>
            <tr>
                <td>Carol Williams</td>
                <td>UX Designer</td>
                <td>92</td>
                <td>Creative and detail-oriented</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
