<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e6f2ff;
            padding: 40px;
            margin: 0;
        }
        h1 {
            color: #0047ab;
            text-align: center;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 4px 6px rgba(0, 71, 171, 0.2);
        }
        th {
            background-color: #0066cc;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: bold;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #b3d9ff;
            color: #003366;
        }
        tr:hover {
            background-color: #f0f8ff;
        }
        tr:last-child td {
            border-bottom: 2px solid #0066cc;
        }
    </style>
</head>
<body>
    <h1>Generated by claude</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Johnson</td>
                <td>Software Engineer</td>
                <td>92</td>
                <td>Excellent problem-solving skills</td>
            </tr>
            <tr>
                <td>Bob Martinez</td>
                <td>Product Manager</td>
                <td>88</td>
                <td>Strong leadership and vision</td>
            </tr>
            <tr>
                <td>Carol Chen</td>
                <td>UX Designer</td>
                <td>95</td>
                <td>Outstanding attention to detail</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
