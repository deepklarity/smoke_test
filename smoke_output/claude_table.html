<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Agent Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }
        h2 {
            color: #6b46c1;
            text-align: center;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        th {
            background-color: #6b46c1;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: bold;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #e9d5ff;
        }
        tr:nth-child(even) {
            background-color: #f3e8ff;
        }
        tr:hover {
            background-color: #e9d5ff;
        }
    </style>
</head>
<body>
    <h2>Claude Agent Table</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Chen</td>
                <td>Software Engineer</td>
                <td>95</td>
                <td>Excellent problem-solving skills</td>
            </tr>
            <tr>
                <td>Bob Martinez</td>
                <td>Product Designer</td>
                <td>88</td>
                <td>Strong visual design capabilities</td>
            </tr>
            <tr>
                <td>Carol Johnson</td>
                <td>Data Analyst</td>
                <td>92</td>
                <td>Outstanding analytical insights</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
