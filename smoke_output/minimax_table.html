<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniMax Agent - Team Roster</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff5e6;
            padding: 20px;
        }
        h1 {
            color: #ff6600;
            text-align: center;
        }
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
            border: 2px solid #ff6600;
        }
        th {
            background-color: #ff6600;
            color: white;
            padding: 12px;
            text-align: left;
        }
        td {
            padding: 10px;
            border: 1px solid #ff9933;
        }
        tr:nth-child(even) {
            background-color: #ffe6cc;
        }
        tr:nth-child(odd) {
            background-color: #fff5e6;
        }
    </style>
</head>
<body>
    <h1>MiniMax Agent - Team Roster</h1>
    <table>
        <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Score</th>
            <th>Notes</th>
        </tr>
        <tr>
            <td>Alex Chen</td>
            <td>Lead Developer</td>
            <td>98</td>
            <td>Expert in algorithms</td>
        </tr>
        <tr>
            <td>Jordan Smith</td>
            <td>UX Designer</td>
            <td>95</td>
            <td>Strong creative vision</td>
        </tr>
        <tr>
            <td>Taylor Wong</td>
            <td>Data Analyst</td>
            <td>92</td>
            <td>Machine learning specialist</td>
        </tr>
    </table>
</body>
</html>
