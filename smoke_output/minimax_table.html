<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniMax Agent</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #fff5e6;
        }
        h1 {
            color: #e65100;
            border-bottom: 3px solid #ff9800;
            padding-bottom: 10px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 600px;
        }
        th {
            background-color: #ff9800;
            color: white;
            padding: 12px;
            text-align: left;
            border: 1px solid #e65100;
        }
        td {
            padding: 10px;
            border: 1px solid #ffcc80;
        }
        tr:nth-child(even) {
            background-color: #ffe0b2;
        }
        tr:nth-child(odd) {
            background-color: #fff3e0;
        }
        tr:hover {
            background-color: #ffcc80;
        }
    </style>
</head>
<body>
    <h1>MiniMax</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Chen</td>
                <td>Developer</td>
                <td>95</td>
                <td>Excellent problem-solving skills</td>
            </tr>
            <tr>
                <td>Bob Martinez</td>
                <td>Designer</td>
                <td>88</td>
                <td>Creative vision and attention to detail</td>
            </tr>
            <tr>
                <td>Carol Johnson</td>
                <td>Lead</td>
                <td>92</td>
                <td>Strong leadership and communication</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
