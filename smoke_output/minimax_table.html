<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniMax Agent Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h1 {
            color: #ff6600;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid #ff6600;
        }
        th {
            background-color: #ff6600;
            color: white;
            padding: 12px;
            text-align: left;
        }
        td {
            padding: 10px;
            border: 1px solid #ff9933;
        }
        tr:nth-child(even) {
            background-color: #ffe6cc;
        }
        tr:nth-child(odd) {
            background-color: #fff5e6;
        }
        tr:hover {
            background-color: #ffcc99;
        }
    </style>
</head>
<body>
    <h1>MiniMax - Agent Information</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Chen</td>
                <td>Lead Developer</td>
                <td>95</td>
                <td>Excellent performance</td>
            </tr>
            <tr>
                <td>Bob Martinez</td>
                <td>Data Analyst</td>
                <td>87</td>
                <td>Strong analytical skills</td>
            </tr>
            <tr>
                <td>Carol Johnson</td>
                <td>Project Manager</td>
                <td>92</td>
                <td>Great team coordination</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
