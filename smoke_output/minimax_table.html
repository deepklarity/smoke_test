<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniMax Agent</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #fff5e6;
        }
        h1 {
            color: #ff6600;
            border-bottom: 2px solid #ff6600;
            padding-bottom: 10px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
        }
        th {
            background-color: #ff6600;
            color: white;
            padding: 12px;
            text-align: left;
            border: 1px solid #cc5200;
        }
        td {
            padding: 10px;
            border: 1px solid #ffcc80;
        }
        tr:nth-child(even) {
            background-color: #ffe0b3;
        }
        tr:nth-child(odd) {
            background-color: #fff5e6;
        }
        tr:hover {
            background-color: #ffcc80;
        }
    </style>
</head>
<body>
    <h1>MiniMax</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Johnson</td>
                <td>Developer</td>
                <td>95</td>
                <td>Excellent performance</td>
            </tr>
            <tr>
                <td>Bob Smith</td>
                <td>Designer</td>
                <td>87</td>
                <td>Creative solutions</td>
            </tr>
            <tr>
                <td>Carol Williams</td>
                <td>Manager</td>
                <td>92</td>
                <td>Strong leadership</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
