<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>MiniMax Agent Table</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; background-color: #fff8f0;">

                <th style="padding: 12px; text-align: left; border: 1px solid #d35400;">Role</th>
                <th style="padding: 12px; text-align: left; border: 1px solid #d35400;">Score</th>
                <th style="padding: 12px; text-align: left; border: 1px solid #d35400;">Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr style="background-color: #fdebd0;">
                <td style="padding: 12px; border: 1px solid #d35400;">Alice Chen</td>
                <td style="padding: 12px; border: 1px solid #d35400;">Frontend Developer</td>
                <td style="padding: 12px; border: 1px solid #d35400;">92</td>
                <td style="padding: 12px; border: 1px solid #d35400;">Excellent UI skills</td>
            </tr>
            <tr style="background-color: #f5cba7;">
                <td style="padding: 12px; border: 1px solid #d35400;">Bob Martinez</td>
                <td style="padding: 12px; border: 1px solid #d35400;">Backend Engineer</td>
                <td style="padding: 12px; border: 1px solid #d35400;">88</td>
                <td style="padding: 12px; border: 1px solid #d35400;">Strong API design</td>
            </tr>
            <tr style="background-color: #fdebd0;">
                <td style="padding: 12px; border: 1px solid #d35400;">Carol Williams</td>
                <td style="padding: 12px; border: 1px solid #d35400;">Data Scientist</td>
                <td style="padding: 12px; border: 1px solid #d35400;">95</td>
                <td style="padding: 12px; border: 1px solid #d35400;">ML expertise</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
