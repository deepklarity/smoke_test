<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    h1 { color: #e65100; }
    table { border-collapse: collapse; width: 100%; border: 2px solid #ff9800; }
    th { background-color: #ff9800; color: white; padding: 12px; text-align: left; border: 1px solid #f57c00; }
    td { padding: 10px; border: 1px solid #ffcc80; }
    tr:nth-child(even) td { background-color: #fff3e0; }
    tr:nth-child(odd) td { background-color: #ffffff; }
  </style>
</head>
<body>
  <h1>MiniMax Agent Data</h1>
  <table>
    <tr>
      <th>Name</th>
      <th>Role</th>
      <th>Score</th>
      <th>Notes</th>
    </tr>
    <tr>
      <td>Alice Chen</td>
      <td>Developer</td>
      <td>95</td>
      <td>Excellent problem-solving skills</td>
    </tr>
    <tr>
      <td>Bob Martinez</td>
      <td>Designer</td>
      <td>88</td>
      <td>Strong creative vision</td>
    </tr>
    <tr>
      <td>Carol Johnson</td>
      <td>Tester</td>
      <td>92</td>
      <td>Thorough attention to detail</td>
    </tr>
  </table>
</body>
</html>
