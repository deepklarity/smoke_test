<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniMax Agent Table</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 20px; background-color: #fff8f0;">
    <h2 style="color: #e65100; margin-bottom: 20px;">MiniMax Agent Table</h2>

                <th style="padding: 12px; text-align: left; border: 1px solid #ff9800; color: #ffffff;">Score</th>
                <th style="padding: 12px; text-align: left; border: 1px solid #ff9800; color: #ffffff;">Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr style="background-color: #ffe0b2;">
                <td style="padding: 12px; border: 1px solid #ff9800;">Alice Chen</td>
                <td style="padding: 12px; border: 1px solid #ff9800;">Lead Developer</td>
                <td style="padding: 12px; border: 1px solid #ff9800;">95</td>
                <td style="padding: 12px; border: 1px solid #ff9800;">Expert in ML pipelines</td>
            </tr>
            <tr style="background-color: #ffcc80;">
                <td style="padding: 12px; border: 1px solid #ff9800;">Bob Martinez</td>
                <td style="padding: 12px; border: 1px solid #ff9800;">Data Scientist</td>
                <td style="padding: 12px; border: 1px solid #ff9800;">88</td>
                <td style="padding: 12px; border: 1px solid #ff9800;">Specializes in NLP models</td>
            </tr>
            <tr style="background-color: #ffe0b2;">
                <td style="padding: 12px; border: 1px solid #ff9800;">Carol Kim</td>
                <td style="padding: 12px; border: 1px solid #ff9800;">Product Manager</td>
                <td style="padding: 12px; border: 1px solid #ff9800;">92</td>
                <td style="padding: 12px; border: 1px solid #ff9800;">Strong roadmap execution</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
