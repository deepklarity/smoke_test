<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen Agent Table</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 40px; background-color: #f5f5f5;">
    <h2 style="color: #1a5276; text-align: center; margin-bottom: 30px;">Qwen Agent Table</h2>
    
    <table style="width: 100%; max-width: 800px; margin: 0 auto; border-collapse: collapse; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
        <thead>
            <tr style="background-color: #1e88e5;">
                <th style="padding: 15px; text-align: left; color: white; border: 1px solid #1565c0;">Name</th>
                <th style="padding: 15px; text-align: left; color: white; border: 1px solid #1565c0;">Role</th>
                <th style="padding: 15px; text-align: left; color: white; border: 1px solid #1565c0;">Score</th>
                <th style="padding: 15px; text-align: left; color: white; border: 1px solid #1565c0;">Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr style="background-color: #e3f2fd;">
                <td style="padding: 12px; border: 1px solid #bbdefb; color: #333;">Alice Chen</td>
                <td style="padding: 12px; border: 1px solid #bbdefb; color: #333;">Developer</td>
                <td style="padding: 12px; border: 1px solid #bbdefb; color: #333;">95</td>
                <td style="padding: 12px; border: 1px solid #bbdefb; color: #333;">Excellent problem solver</td>
            </tr>
            <tr style="background-color: #ffffff;">
                <td style="padding: 12px; border: 1px solid #bbdefb; color: #333;">Bob Martinez</td>
                <td style="padding: 12px; border: 1px solid #bbdefb; color: #333;">Designer</td>
                <td style="padding: 12px; border: 1px solid #bbdefb; color: #333;">88</td>
                <td style="padding: 12px; border: 1px solid #bbdefb; color: #333;">Creative and detail-oriented</td>
            </tr>
            <tr style="background-color: #e3f2fd;">
                <td style="padding: 12px; border: 1px solid #bbdefb; color: #333;">Carol Williams</td>
                <td style="padding: 12px; border: 1px solid #bbdefb; color: #333;">Manager</td>
                <td style="padding: 12px; border: 1px solid #bbdefb; color: #333;">92</td>
                <td style="padding: 12px; border: 1px solid #bbdefb; color: #333;">Great team leadership</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
