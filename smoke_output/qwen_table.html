<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen Agent Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #1e3a8a;
            text-align: center;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        thead {
            background-color: #1e40af;
            color: #ffffff;
        }
        th {
            padding: 15px 12px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #dbeafe;
            color: #374151;
        }
        tbody tr:nth-child(odd) {
            background-color: #dbeafe;
        }
        tbody tr:nth-child(even) {
            background-color: #eff6ff;
        }
        tbody tr:hover {
            background-color: #bfdbfe;
        }
    </style>
</head>
<body>
    <h1>Qwen Agent - Team Members</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Chen</td>
                <td>Frontend Developer</td>
                <td>95</td>
                <td>Excellent UI/UX skills</td>
            </tr>
            <tr>
                <td>Bob Martinez</td>
                <td>Backend Engineer</td>
                <td>88</td>
                <td>Strong API design expertise</td>
            </tr>
            <tr>
                <td>Carol Johnson</td>
                <td>DevOps Specialist</td>
                <td>92</td>
                <td>Cloud infrastructure expert</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
