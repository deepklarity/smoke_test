<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen - Agent Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f9ff;
        }
        h1 {
            color: #1a5fb4;
            text-align: center;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 auto;
            max-width: 800px;
            box-shadow: 0 2px 8px rgba(26, 95, 180, 0.2);
        }
        thead {
            background-color: #1a5fb4;
            color: white;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border: 1px solid #a8c5e8;
        }
        th {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        tbody tr:nth-child(odd) {
            background-color: #e8f4ff;
        }
        tbody tr:nth-child(even) {
            background-color: #ffffff;
        }
        tbody tr:hover {
            background-color: #d0e8ff;
        }
        .score {
            font-weight: bold;
            color: #1a5fb4;
        }
    </style>
</head>
<body>
    <h1>Qwen</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Chen</td>
                <td>Frontend Developer</td>
                <td class="score">95</td>
                <td>Excellent UI/UX skills</td>
            </tr>
            <tr>
                <td>Bob Martinez</td>
                <td>Backend Engineer</td>
                <td class="score">88</td>
                <td>Strong API design</td>
            </tr>
            <tr>
                <td>Carol Johnson</td>
                <td>DevOps Specialist</td>
                <td class="score">92</td>
                <td>Cloud infrastructure expert</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
