<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Agent Table</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff5f5;
      color: #4a0d0d;
      margin: 24px;
    }

    h2 {
      color: #b30000;
      margin-bottom: 14px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 820px;
      border: 2px solid #b30000;
      background: #ffffff;
    }

    th,
    td {
      border: 1px solid #d9534f;
      padding: 10px 12px;
      text-align: left;
    }

    th {
      background: #c62828;
      color: #ffffff;
    }

    tbody tr:nth-child(odd) {
      background: #ffe5e5;
    }

    tbody tr:nth-child(even) {
      background: #fff0f0;
    }
  </style>
</head>
<body>
  <h2>Codex Agent's Table</h2>
  <table aria-label="Codex agent data table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Role</th>
        <th>Score</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Avery Quinn</td>
        <td>Navigator</td>
        <td>91</td>
        <td>Excellent at scenario mapping.</td>
      </tr>
      <tr>
        <td>Milo Hart</td>
        <td>Analyst</td>
        <td>87</td>
        <td>Strong pattern detection under pressure.</td>
      </tr>
      <tr>
        <td>Rina Sol</td>
        <td>Coordinator</td>
        <td>95</td>
        <td>Keeps team output consistent and timely.</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
