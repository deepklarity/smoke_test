<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Table</title>
</head>
<body style="margin: 0; padding: 32px; background: #fff5f5; font-family: Arial, Helvetica, sans-serif; color: #4a0f0f;">

      <tr style="background: #b22222; color: #ffffff;">
        <th style="padding: 12px; border: 1px solid #8b0000; text-align: left;">Name</th>
        <th style="padding: 12px; border: 1px solid #8b0000; text-align: left;">Role</th>
        <th style="padding: 12px; border: 1px solid #8b0000; text-align: left;">Score</th>
        <th style="padding: 12px; border: 1px solid #8b0000; text-align: left;">Notes</th>
      </tr>
    </thead>
    <tbody>
      <tr style="background: #ffecec;">
        <td style="padding: 10px; border: 1px solid #c62828;">Aria Vale</td>
        <td style="padding: 10px; border: 1px solid #c62828;">Navigator</td>
        <td style="padding: 10px; border: 1px solid #c62828;">92</td>
        <td style="padding: 10px; border: 1px solid #c62828;">Excellent spatial planning.</td>
      </tr>
      <tr style="background: #ffdede;">
        <td style="padding: 10px; border: 1px solid #c62828;">Damon Cross</td>
        <td style="padding: 10px; border: 1px solid #c62828;">Strategist</td>
        <td style="padding: 10px; border: 1px solid #c62828;">88</td>
        <td style="padding: 10px; border: 1px solid #c62828;">Strong in late-round adjustments.</td>
      </tr>
      <tr style="background: #ffecec;">
        <td style="padding: 10px; border: 1px solid #c62828;">Mina Rowe</td>
        <td style="padding: 10px; border: 1px solid #c62828;">Analyst</td>
        <td style="padding: 10px; border: 1px solid #c62828;">95</td>
        <td style="padding: 10px; border: 1px solid #c62828;">Top performer in trend analysis.</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
