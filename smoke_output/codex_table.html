<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Table</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff5f5;
      color: #7f1d1d;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      margin-top: 48px;
      width: min(900px, 92vw);
    }

    h1 {
      margin: 0 0 16px;
      color: #b91c1c;
      font-size: 2rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border: 2px solid #b91c1c;
      box-shadow: 0 8px 20px rgba(127, 29, 29, 0.12);
    }

    th,
    td {
      border: 1px solid #ef4444;
      padding: 12px 14px;
      text-align: left;
    }

    th {
      background: #dc2626;
      color: #ffffff;
    }

    tbody tr:nth-child(even) {
      background: #fef2f2;
    }

    tbody tr:hover {
      background: #fee2e2;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Generated by Codex</h1>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Role</th>
          <th>Score</th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Lena Hart</td>
          <td>Navigator</td>
          <td>91</td>
          <td>Excellent route planning under pressure.</td>
        </tr>
        <tr>
          <td>Marco Vale</td>
          <td>Analyst</td>
          <td>87</td>
          <td>Strong pattern detection, quick insights.</td>
        </tr>
        <tr>
          <td>Zuri Quinn</td>
          <td>Coordinator</td>
          <td>94</td>
          <td>Kept the team synchronized and on pace.</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
