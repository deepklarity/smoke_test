<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Agent Table</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #fff5f5; margin: 32px; color: #5f0a0a;">
  <h2 style="margin-bottom: 14px; color: #b30000;">Codex Agent Table</h2>

  <table style="width: 100%; max-width: 900px; border-collapse: collapse; border: 1px solid #d66; box-shadow: 0 2px 8px rgba(179, 0, 0, 0.15);">
    <thead>
      <tr style="background-color: #c40000; color: #ffffff;">
        <th style="padding: 12px; border: 1px solid #b30000; text-align: left;">Name</th>
        <th style="padding: 12px; border: 1px solid #b30000; text-align: left;">Role</th>
        <th style="padding: 12px; border: 1px solid #b30000; text-align: left;">Score</th>
        <th style="padding: 12px; border: 1px solid #b30000; text-align: left;">Notes</th>
      </tr>
    </thead>
    <tbody>
      <tr style="background-color: #ffe5e5;">
        <td style="padding: 10px; border: 1px solid #e79a9a;">Rhea Nolan</td>
        <td style="padding: 10px; border: 1px solid #e79a9a;">Coordinator</td>
        <td style="padding: 10px; border: 1px solid #e79a9a;">92</td>
        <td style="padding: 10px; border: 1px solid #e79a9a;">Strong planning and follow-through.</td>
      </tr>
      <tr style="background-color: #ffd1d1;">
        <td style="padding: 10px; border: 1px solid #e79a9a;">Kai Mercer</td>
        <td style="padding: 10px; border: 1px solid #e79a9a;">Analyst</td>
        <td style="padding: 10px; border: 1px solid #e79a9a;">88</td>
        <td style="padding: 10px; border: 1px solid #e79a9a;">Clear insights with concise reports.</td>
      </tr>
      <tr style="background-color: #ffe5e5;">
        <td style="padding: 10px; border: 1px solid #e79a9a;">Mira Chen</td>
        <td style="padding: 10px; border: 1px solid #e79a9a;">Developer</td>
        <td style="padding: 10px; border: 1px solid #e79a9a;">95</td>
        <td style="padding: 10px; border: 1px solid #e79a9a;">Delivers robust features quickly.</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
