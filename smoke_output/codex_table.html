<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Red Table</title>
  <style>
    body {
      margin: 0;
      padding: 32px;
      font-family: Arial, sans-serif;
      background: #ffe6e6;
      color: #4d0000;
    }

    h1 {
      margin: 0 0 16px;
      color: #990000;
    }

    table {
      width: 100%;
      max-width: 760px;
      border-collapse: collapse;
      background: #fff5f5;
      border: 2px solid #cc0000;
    }

    th,
    td {
      border: 1px solid #cc0000;
      padding: 12px;
      text-align: left;
    }

    th {
      background: #cc0000;
      color: #ffffff;
      font-weight: bold;
    }

    tbody tr:nth-child(even) {
      background: #ffe6e6;
    }
  </style>
</head>
<body>
  <h1>Generated by Codex</h1>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Role</th>
        <th>Score</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Aria Quinn</td>
        <td>Analyst</td>
        <td>92</td>
        <td>Excellent pattern recognition.</td>
      </tr>
      <tr>
        <td>Leo Harrow</td>
        <td>Coordinator</td>
        <td>87</td>
        <td>Strong delivery under pressure.</td>
      </tr>
      <tr>
        <td>Nina Vale</td>
        <td>Designer</td>
        <td>95</td>
        <td>Creative concepts with clear execution.</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
