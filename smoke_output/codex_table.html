<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Agent Table</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff5f5;
      color: #3a1a1a;
      margin: 24px;
    }

    h2 {
      color: #b30000;
      margin-bottom: 12px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 700px;
      background: #ffe6e6;
      border: 2px solid #cc0000;
    }

    thead th {
      background: #cc0000;
      color: #ffffff;
      text-align: left;
      padding: 10px;
      border: 1px solid #990000;
    }

    tbody td {
      padding: 10px;
      border: 1px solid #ffb3b3;
      background: #fff0f0;
    }

    tbody tr:nth-child(even) td {
      background: #ffd9d9;
    }
  </style>
</head>
<body>
  <h2>Codex Agent Table</h2>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Role</th>
        <th>Score</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Avery Quinn</td>
        <td>Analyst</td>
        <td>92</td>
        <td>Strong pattern recognition and clear reporting.</td>
      </tr>
      <tr>
        <td>Riley Chen</td>
        <td>Engineer</td>
        <td>88</td>
        <td>Delivers reliable fixes under tight deadlines.</td>
      </tr>
      <tr>
        <td>Jordan Vale</td>
        <td>Coordinator</td>
        <td>95</td>
        <td>Keeps projects aligned and communication smooth.</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
