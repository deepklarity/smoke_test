<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Agent Table</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff7f7;
      color: #3b0d0d;
    }

    h2 {
      margin: 0 0 16px;
      color: #9b111e;
    }

    table {
      width: 100%;
      max-width: 760px;
      border-collapse: collapse;
      border: 1px solid #d87c7c;
      box-shadow: 0 2px 8px rgba(155, 17, 30, 0.12);
      background: #ffffff;
    }

    thead th {
      background: #c62828;
      color: #ffffff;
      text-align: left;
      padding: 12px;
      font-size: 14px;
      letter-spacing: 0.2px;
    }

    tbody td {
      padding: 11px 12px;
      border-top: 1px solid #f2b5b5;
      font-size: 14px;
    }

    tbody tr:nth-child(odd) {
      background: #ffe5e5;
    }

    tbody tr:nth-child(even) {
      background: #ffd1d1;
    }
  </style>
</head>
<body>
  <h2>Codex Agent&apos;s Red-Themed Table</h2>
  <table aria-label="Codex agent table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Role</th>
        <th>Score</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Aria Vale</td>
        <td>Data Scout</td>
        <td>92</td>
        <td>Excellent anomaly detection.</td>
      </tr>
      <tr>
        <td>Niko Cross</td>
        <td>System Tuner</td>
        <td>88</td>
        <td>Improved latency in nightly runs.</td>
      </tr>
      <tr>
        <td>Lena Quill</td>
        <td>UX Analyst</td>
        <td>95</td>
        <td>Delivered high-impact usability insights.</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
