<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Agent Table</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff5f5;
      color: #2b0a0a;
      padding: 32px;
    }

    h1 {
      margin: 0 0 20px;
      color: #b30000;
      text-align: center;
    }

    .table-wrap {
      max-width: 900px;
      margin: 0 auto;
      border: 1px solid #e08a8a;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(179, 0, 0, 0.15);
      background: #ffffff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: #cc0000;
      color: #ffffff;
    }

    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid #f0b3b3;
    }

    tbody tr:nth-child(odd) {
      background: #ffe6e6;
    }

    tbody tr:nth-child(even) {
      background: #fff2f2;
    }

    tbody tr:hover {
      background: #ffd6d6;
    }
  </style>
</head>
<body>
  <h1>Codex Agent — Fictional Team Score Table</h1>
  <div class="table-wrap">
    <table aria-label="Fictional team table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Role</th>
          <th>Score</th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Ava Calder</td>
          <td>Data Analyst</td>
          <td>91</td>
          <td>Excellent trend spotting and reporting.</td>
        </tr>
        <tr>
          <td>Liam Ortiz</td>
          <td>Backend Engineer</td>
          <td>88</td>
          <td>Reliable API performance and uptime.</td>
        </tr>
        <tr>
          <td>Noor Rahman</td>
          <td>Product Designer</td>
          <td>94</td>
          <td>Strong UX improvements with clear rationale.</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
