<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Table</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #e8f5e9;
      color: #1b5e20;
    }

    h1 {
      margin: 0 0 16px;
      color: #2e7d32;
    }

    table {
      width: 100%;
      max-width: 760px;
      border-collapse: collapse;
      background: #f1f8e9;
      border: 2px solid #2e7d32;
    }

    th,
    td {
      padding: 10px 12px;
      border: 1px solid #66bb6a;
      text-align: left;
    }

    th {
      background: #66bb6a;
      color: #ffffff;
    }

    tr:nth-child(even) {
      background: #dcedc8;
    }
  </style>
</head>
<body>
  <h1>Generated by codex</h1>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Role</th>
        <th>Score</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Avery Quinn</td>
        <td>Systems Analyst</td>
        <td>91</td>
        <td>Excellent at finding edge cases.</td>
      </tr>
      <tr>
        <td>Milo Hart</td>
        <td>Product Designer</td>
        <td>87</td>
        <td>Strong visual consistency and UX flow.</td>
      </tr>
      <tr>
        <td>Zara Flint</td>
        <td>QA Engineer</td>
        <td>94</td>
        <td>Great automation coverage this sprint.</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
