<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Smoke Table</title>
  <style>
    body {
      margin: 0;
      padding: 32px;
      font-family: Arial, sans-serif;
      background: #fff5f5;
      color: #4a0d0d;
    }

    h1 {
      margin: 0 0 16px;
      color: #b30000;
    }

    .table-wrap {
      max-width: 900px;
      border: 1px solid #f2b8b8;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(179, 0, 0, 0.12);
      background: #ffffff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      background: #c62828;
      color: #ffffff;
      text-align: left;
      padding: 12px;
      font-size: 15px;
    }

    tbody td {
      padding: 12px;
      border-bottom: 1px solid #f5cfcf;
      font-size: 14px;
    }

    tbody tr:nth-child(odd) {
      background: #ffeaea;
    }

    tbody tr:nth-child(even) {
      background: #fff7f7;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <h1>Codex Agent Output: Red-Themed Team Table</h1>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Role</th>
          <th>Score</th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Aria Vale</td>
          <td>Analyst</td>
          <td>91</td>
          <td>Strong pattern recognition and reporting clarity.</td>
        </tr>
        <tr>
          <td>Jaxon Reed</td>
          <td>Engineer</td>
          <td>88</td>
          <td>Delivered stable modules ahead of schedule.</td>
        </tr>
        <tr>
          <td>Mina Sol</td>
          <td>Coordinator</td>
          <td>94</td>
          <td>Excellent cross-team communication and follow-through.</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
