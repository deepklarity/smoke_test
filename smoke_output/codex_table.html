<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Agent Table</title>
  <style>
    body {
      margin: 0;
      padding: 32px;
      font-family: Arial, sans-serif;
      background-color: #fff5f5;
      color: #4a0a0a;
    }

    h2 {
      margin: 0 0 16px;
      color: #a40000;
    }

    table {
      width: 100%;
      max-width: 800px;
      border-collapse: collapse;
      border: 2px solid #d32f2f;
      box-shadow: 0 4px 10px rgba(211, 47, 47, 0.15);
      background-color: #fff;
    }

    thead th {
      background-color: #c62828;
      color: #ffffff;
      text-align: left;
      padding: 12px;
      border: 1px solid #b71c1c;
    }

    tbody td {
      padding: 10px 12px;
      border: 1px solid #ef9a9a;
    }

    tbody tr:nth-child(odd) {
      background-color: #ffebee;
    }

    tbody tr:nth-child(even) {
      background-color: #ffcdd2;
    }
  </style>
</head>
<body>
  <h2>Codex Agent's Red-Themed Table</h2>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Role</th>
        <th>Score</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Avery Quinn</td>
        <td>Design Lead</td>
        <td>92</td>
        <td>Delivers polished mockups quickly.</td>
      </tr>
      <tr>
        <td>Rafael Moore</td>
        <td>Backend Engineer</td>
        <td>88</td>
        <td>Improved API latency this sprint.</td>
      </tr>
      <tr>
        <td>Sana Patel</td>
        <td>QA Analyst</td>
        <td>95</td>
        <td>Found key edge cases before release.</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
