<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLM Agent Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f0f8f8;
        }
        h1 {
            color: #008080;
            text-align: center;
            border-bottom: 2px solid #008080;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        thead {
            background-color: #008080;
            color: white;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border: 1px solid #ddd;
        }
        tbody tr:nth-child(even) {
            background-color: #e0f2f2;
        }
        tbody tr:nth-child(odd) {
            background-color: #ffffff;
        }
        tbody tr:hover {
            background-color: #b2dfdb;
        }
        td.score {
            font-weight: bold;
            color: #006666;
        }
    </style>
</head>
<body>
    <h1>GLM Agent Performance Data</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alex Chen</td>
                <td>Data Analyst</td>
                <td class="score">92</td>
                <td>Exceptional pattern recognition skills</td>
            </tr>
            <tr>
                <td>Maria Rodriguez</td>
                <td>UI Designer</td>
                <td class="score">88</td>
                <td>Strong visual design principles</td>
            </tr>
            <tr>
                <td>James Wilson</td>
                <td>Backend Developer</td>
                <td class="score">95</td>
                <td>Expert in system architecture</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
