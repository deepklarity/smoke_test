<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLM Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f8f8;
        }
        h2 {
            color: #008080;
            text-align: center;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th {
            background-color: #008080;
            color: white;
            padding: 12px 15px;
            text-align: left;
            border: 1px solid #006666;
        }
        td {
            padding: 12px 15px;
            border: 1px solid #ccc;
        }
        tr:nth-child(even) {
            background-color: #e0f2f2;
        }
        tr:nth-child(odd) {
            background-color: #ffffff;
        }
        tr:hover {
            background-color: #b2ebeb;
        }
    </style>
</head>
<body>
    <h2>GLM</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alex Johnson</td>
                <td>Developer</td>
                <td>92</td>
                <td>Exceeded expectations in Q1</td>
            </tr>
            <tr>
                <td>Sarah Chen</td>
                <td>Designer</td>
                <td>88</td>
                <td>Strong creative contributions</td>
            </tr>
            <tr>
                <td>Michael Torres</td>
                <td>Manager</td>
                <td>95</td>
                <td>Excellent team leadership</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
