<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLM Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f0fdfa;
        }
        h1 {
            color: #00897b;
            text-align: center;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        thead {
            background-color: #00897b;
            color: white;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0f2f1;
        }
        th {
            font-weight: bold;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        tr:hover {
            background-color: #e0f2f1;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .score {
            color: #00796b;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Created by GLM Agent</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alex Morgan</td>
                <td>Frontend Developer</td>
                <td class="score">92</td>
                <td>Excellent UI/UX skills</td>
            </tr>
            <tr>
                <td>Kevin Patel</td>
                <td>Data Scientist</td>
                <td class="score">88</td>
                <td>Strong ML background</td>
            </tr>
            <tr>
                <td>Rachel Green</td>
                <td>DevOps Engineer</td>
                <td class="score">95</td>
                <td>Certified cloud architect</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
