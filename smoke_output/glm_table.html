<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLM Agent Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f0fdfa;
        }
        h1 {
            color: #0d9488;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        th {
            background-color: #0d9488;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            font-size: 1.1em;
        }
        td {
            padding: 12px 15px;
            border: 1px solid #ccfbf1;
        }
        tr:nth-child(even) {
            background-color: #ccfbf1;
        }
        tr:nth-child(odd) {
            background-color: #f0fdfa;
        }
        tr:hover {
            background-color: #99f6e4;
        }
    </style>
</head>
<body>
    <h1>GLM</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alex Johnson</td>
                <td>Developer</td>
                <td>95</td>
                <td>Excellent performance on recent project</td>
            </tr>
            <tr>
                <td>Maria Garcia</td>
                <td>Designer</td>
                <td>88</td>
                <td>Creative UI solutions, needs to improve documentation</td>
            </tr>
            <tr>
                <td>James Wilson</td>
                <td>Project Manager</td>
                <td>92</td>
                <td>Strong leadership, completed milestone ahead of schedule</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
