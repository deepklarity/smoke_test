<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLM Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #e0f2f1;
        }
        h1 {
            color: #00897b;
            text-align: center;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            background-color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        th, td {
            border: 1px solid #00796b;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #00897b;
            color: white;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #e0f2f1;
        }
        tr:hover {
            background-color: #b2dfdb;
        }
    </style>
</head>
<body>
    <h1>Created by GLM Agent</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>James Wilson</td>
                <td>Database Administrator</td>
                <td>92</td>
                <td>Expert in PostgreSQL and MongoDB optimization</td>
            </tr>
            <tr>
                <td>Maria Garcia</td>
                <td>QA Engineer</td>
                <td>88</td>
                <td>Specializes in automated testing frameworks</td>
            </tr>
            <tr>
                <td>Christopher Taylor</td>
                <td>Security Analyst</td>
                <td>95</td>
                <td>Certified in penetration testing and compliance</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
