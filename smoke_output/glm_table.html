<!DOCTYPE html>
<html>
<head>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #008080;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #008080;
            color: white;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #e0f2f1;
        }
        tr:hover {
            background-color: #b2dfdb;
        }
    </style>
</head>
<body>
    <h2>GLM</h2>
    <table>
        <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Score</th>
            <th>Notes</th>
        </tr>
        <tr>
            <td>Alice Johnson</td>
            <td>Developer</td>
            <td>95</td>
            <td>Excellent performance in Q4</td>
        </tr>
        <tr>
            <td>Bob Smith</td>
            <td>Designer</td>
            <td>88</td>
            <td>Creative lead for new project</td>
        </tr>
        <tr>
            <td>Carol Davis</td>
            <td>Manager</td>
            <td>92</td>
            <td>Team coordination expert</td>
        </tr>
    </table>
</body>
</html>
