<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLM Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0f2f1;
            margin: 40px;
            color: #004d40;
        }
        h1 {
            color: #00796b;
            text-align: center;
            margin-bottom: 30px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 77, 64, 0.1);
        }
        th {
            background-color: #00897b;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            border-bottom: 3px solid #00695c;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #b2dfdb;
        }
        tr:hover {
            background-color: #e0f2f1;
        }
        tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <h1>Created by GLM Agent</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>David Martinez</td>
                <td>DevOps Engineer</td>
                <td>92</td>
                <td>Expert in CI/CD pipelines</td>
            </tr>
            <tr>
                <td>Jessica Williams</td>
                <td>Product Manager</td>
                <td>88</td>
                <td>Great stakeholder communication</td>
            </tr>
            <tr>
                <td>Robert Thompson</td>
                <td>Full Stack Developer</td>
                <td>95</td>
                <td>Lead architect on main project</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
