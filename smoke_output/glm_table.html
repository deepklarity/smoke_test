<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLM Agent Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f8f8;
        }
        h2 {
            color: #008080;
            margin-bottom: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 2px 4px rgba(0, 128, 128, 0.1);
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border: 1px solid #b2d8d8;
        }
        th {
            background-color: #008080;
            color: white;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #e6f2f2;
        }
        tr:hover {
            background-color: #cce6e6;
        }
    </style>
</head>
<body>
    <h2>GLM Agent Table</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alex Chen</td>
                <td>Data Analyst</td>
                <td>95</td>
                <td>Excellent performance in Q1</td>
            </tr>
            <tr>
                <td>Sarah Johnson</td>
                <td>Team Lead</td>
                <td>88</td>
                <td>Strong leadership skills</td>
            </tr>
            <tr>
                <td>Michael Brown</td>
                <td>Developer</td>
                <td>92</td>
                <td>Key contributor to recent project</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
