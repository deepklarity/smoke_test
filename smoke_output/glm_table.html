<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLM Agent Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f0fdfa;
        }
        h1 {
            color: #0d9488;
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-collapse: collapse;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        thead {
            background-color: #14b8a6;
        }
        th {
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            font-size: 1.1em;
            border: 1px solid #0d9488;
        }
        tbody tr {
            background-color: #ccfbf1;
        }
        tbody tr:nth-child(even) {
            background-color: #99f6e4;
        }
        tbody tr:hover {
            background-color: #5eead4;
        }
        td {
            padding: 12px 15px;
            border: 1px solid #14b8a6;
            color: #134e4a;
        }
    </style>
</head>
<body>
    <h1>GLM</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alex Chen</td>
                <td>Frontend Developer</td>
                <td>95</td>
                <td>Expert in React and TypeScript</td>
            </tr>
            <tr>
                <td>Sarah Miller</td>
                <td>Data Scientist</td>
                <td>88</td>
                <td>Specializes in machine learning</td>
            </tr>
            <tr>
                <td>James Wilson</td>
                <td>Backend Engineer</td>
                <td>92</td>
                <td>Proficient in Python and Go</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
