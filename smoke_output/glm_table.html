<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLM Agent's Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8f8;
            margin: 40px;
        }
        h2 {
            color: #008080;
            text-align: center;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 auto;
            max-width: 800px;
            box-shadow: 0 2px 10px rgba(0, 128, 128, 0.3);
        }
        thead {
            background-color: #008080;
        }
        th {
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: bold;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0f0f0;
        }
        tbody tr:nth-child(even) {
            background-color: #e0f7f7;
        }
        tbody tr:nth-child(odd) {
            background-color: #ffffff;
        }
        tbody tr:hover {
            background-color: #d0e8e8;
        }
    </style>
</head>
<body>
    <h2>GLM Agent's Table</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alex Johnson</td>
                <td>Developer</td>
                <td>95</td>
                <td>Exceptional problem-solving skills</td>
            </tr>
            <tr>
                <td>Sarah Chen</td>
                <td>Designer</td>
                <td>88</td>
                <td>Creative UI/UX specialist</td>
            </tr>
            <tr>
                <td>Michael Brown</td>
                <td>Project Manager</td>
                <td>92</td>
                <td>Excellent team coordination</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
