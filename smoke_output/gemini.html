<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Smoke Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f9f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            color: #2e7d32;
        }
        table {
            border-collapse: collapse;
            width: 80%;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background-color: white;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border: 1px solid #ddd;
        }
        th {
            background-color: #4caf50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #e8f5e9;
        }
        tr:hover {
            background-color: #c8e6c9;
        }
    </style>
</head>
<body>
    <h1>Gemini Smoke Test</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Green</td>
                <td>Developer</td>
                <td>95</td>
                <td>Excellent performance</td>
            </tr>
            <tr>
                <td>Bob Forester</td>
                <td>Designer</td>
                <td>88</td>
                <td>Very creative layouts</td>
            </tr>
            <tr>
                <td>Charlie Moss</td>
                <td>Tester</td>
                <td>92</td>
                <td>Thorough analysis</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
