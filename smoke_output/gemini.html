<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Smoke Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4fdf4;
            color: #333;
        }
        h1 {
            color: #2e7d32;
            text-align: center;
        }
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background-color: #fff;
        }
        th {
            background-color: #4caf50;
            color: white;
            padding: 12px;
            text-align: left;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        tr:nth-child(even) {
            background-color: #e8f5e9;
        }
        tr:hover {
            background-color: #c8e6c9;
        }
    </style>
</head>
<body>
    <h1>Gemini Smoke Test</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Green</td>
                <td>Engineer</td>
                <td>95</td>
                <td>Highly efficient.</td>
            </tr>
            <tr>
                <td>Bob Forest</td>
                <td>Designer</td>
                <td>88</td>
                <td>Creative and fast.</td>
            </tr>
            <tr>
                <td>Charlie Moss</td>
                <td>Product Manager</td>
                <td>92</td>
                <td>Great coordination.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
