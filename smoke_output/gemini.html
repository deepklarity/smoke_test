<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Smoke Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0fdf4;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            color: #166534;
        }
        h1 {
            color: #14532d;
            margin-bottom: 24px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 800px;
            background-color: white;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        th {
            background-color: #22c55e;
            color: white;
            text-align: left;
            padding: 12px 16px;
            font-weight: 600;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #dcfce7;
        }
        tr:nth-child(even) {
            background-color: #f0fdf4;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover {
            background-color: #dcfce7;
        }
    </style>
</head>
<body>
    <h1>Gemini Smoke Test</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Vance</td>
                <td>Engineer</td>
                <td>98</td>
                <td>Excellent performance and code quality.</td>
            </tr>
            <tr>
                <td>Bob Smith</td>
                <td>Designer</td>
                <td>92</td>
                <td>Great attention to detail and UX principles.</td>
            </tr>
            <tr>
                <td>Charlie Brown</td>
                <td>Product Manager</td>
                <td>95</td>
                <td>Strong leadership and clear communication.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
