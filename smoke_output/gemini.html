<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Smoke Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9fdf9;
        }
        h1 {
            color: #2e7d32;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #4caf50;
            color: white;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #e8f5e9;
        }
        tr:hover {
            background-color: #c8e6c9;
        }
    </style>
</head>
<body>
    <h1>Gemini Smoke Test</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Score</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice Vance</td>
                <td>Engineer</td>
                <td>95</td>
                <td>Excellent performance</td>
            </tr>
            <tr>
                <td>Bob Miller</td>
                <td>Designer</td>
                <td>88</td>
                <td>Creative and reliable</td>
            </tr>
            <tr>
                <td>Charlie Root</td>
                <td>Analyst</td>
                <td>92</td>
                <td>Strong analytical skills</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
