[mcp_servers.taskit]
command = "taskit-mcp"

[mcp_servers.taskit.env]
TASKIT_URL = "http://localhost:9101"
TASKIT_AUTH_TOKEN = ""
TASKIT_TASK_ID = "10"
TASKIT_AUTHOR_EMAIL = "codex+gpt-5.3-codex@odin.agent"
TASKIT_AUTHOR_LABEL = "codex (gpt-5.3-codex)"

[mcp_servers.mobile]
command = "npx"
args = ["-y", "@mobilenext/mobile-mcp@latest"]

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest", "--headless"]
