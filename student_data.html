<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --text-color: #1f2937;
            --bg-color: #f9fafb;
            --table-bg: #ffffff;
            --border-color: #e5e7eb;
            --hover-color: #f3f4f6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-weight: 600;
            margin-bottom: 2rem;
            color: var(--text-color);
        }

        .table-container {
            width: 100%;
            max-width: 800px;
            background: var(--table-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background-color: var(--hover-color);
            border-bottom: 2px solid var(--border-color);
        }

        th {
            padding: 1rem;
            font-weight: 600;
            color: #4b5563;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.875rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr {
            transition: background-color 0.2s ease;
        }

        tr:hover {
            background-color: var(--hover-color);
        }

        .marks {
            font-weight: 600;
            color: var(--primary-color);
        }

        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }
            th, td {
                padding: 0.75rem 0.5rem;
            }
        }
    </style>
</head>
<body>

    <h1>Student Data Table</h1>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Class/Grade</th>
                    <th>Marks</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>101</td>
                    <td>Arjun Sharma</td>
                    <td>Grade 10</td>
                    <td class="marks">85</td>
                </tr>
                <tr>
                    <td>102</td>
                    <td>Ananya Iyer</td>
                    <td>Grade 10</td>
                    <td class="marks">92</td>
                </tr>
                <tr>
                    <td>103</td>
                    <td>Ishaan Verma</td>
                    <td>Grade 10</td>
                    <td class="marks">78</td>
                </tr>
                <tr>
                    <td>104</td>
                    <td>Saanvi Reddy</td>
                    <td>Grade 10</td>
                    <td class="marks">88</td>
                </tr>
                <tr>
                    <td>105</td>
                    <td>Vivaan Gupta</td>
                    <td>Grade 10</td>
                    <td class="marks">95</td>
                </tr>
                <tr>
                    <td>106</td>
                    <td>Diya Patel</td>
                    <td>Grade 10</td>
                    <td class="marks">82</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
